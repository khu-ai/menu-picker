<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘 뭐 먹지? 🍚 메뉴 랜덤 뽑기</title>
<meta name="description" content="선택장애를 위한 밥 메뉴 랜덤 추천 사이트">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍚</text></svg>">
<style>
  :root {
    --bg: #fff8ef;
    --card: #ffffff;
    --text: #2b2118;
    --sub: #8a7a6b;
    --accent: #ff5a36;
    --accent-dark: #e0431f;
    --chip: #ffeede;
    --chip-on: #ff5a36;
    --border: #f1e2d2;
    --shadow: 0 10px 30px rgba(120, 70, 20, 0.12);
  }
  body.dark {
    --bg: #1c1814;
    --card: #2a241f;
    --text: #f5ece2;
    --sub: #b3a493;
    --chip: #3a322b;
    --border: #3d342c;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
    transition: background .3s, color .3s;
  }
  .wrap { width: 100%; max-width: 480px; }

  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
  h1 span { color: var(--accent); }
  .sub { color: var(--sub); font-size: 14px; margin-top: 4px; }
  .theme-btn {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    width: 42px; height: 42px; border-radius: 50%; font-size: 18px; cursor: pointer;
  }

  .card {
    background: var(--card); border-radius: 24px; box-shadow: var(--shadow);
    padding: 28px 20px; text-align: center; margin-bottom: 20px;
    border: 1px solid var(--border);
  }
  .emoji { font-size: 84px; line-height: 1.1; height: 96px; }
  .menu-name { font-size: 34px; font-weight: 800; margin-top: 10px; min-height: 44px; letter-spacing: -1px; }
  .menu-cat { color: var(--sub); font-size: 14px; margin-top: 6px; min-height: 20px; }
  .rolling .emoji, .rolling .menu-name { opacity: .55; }
  .pop { animation: pop .45s ease; }
  @keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }

  .pick-btn {
    width: 100%; border: none; border-radius: 18px; padding: 18px;
    background: var(--accent); color: #fff; font-size: 20px; font-weight: 800;
    cursor: pointer; margin-top: 22px; transition: transform .1s, background .2s;
  }
  .pick-btn:hover { background: var(--accent-dark); }
  .pick-btn:active { transform: scale(.97); }
  .pick-btn:disabled { opacity: .6; cursor: default; }

  .result-actions { display: none; gap: 8px; margin-top: 10px; }
  .result-actions.show { display: flex; }
  .result-actions button {
    flex: 1; border: 1px solid var(--border); background: var(--chip); color: var(--text);
    border-radius: 14px; padding: 12px 8px; font-size: 14px; font-weight: 600; cursor: pointer;
  }

  .section-title { font-size: 15px; font-weight: 700; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
  .section-title small { color: var(--sub); font-weight: 500; font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .chip {
    border: none; background: var(--chip); color: var(--text);
    padding: 9px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; cursor: pointer;
    transition: background .2s, color .2s;
  }
  .chip.on { background: var(--chip-on); color: #fff; }

  .excluded { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; }
  .excluded .tag {
    background: transparent; border: 1px dashed var(--sub); color: var(--sub);
    padding: 6px 10px; border-radius: 999px; font-size: 13px; cursor: pointer;
  }
  .empty { color: var(--sub); font-size: 13px; }

  .add-row { display: flex; gap: 8px; margin-bottom: 22px; }
  .add-row input {
    flex: 1; border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 14px; padding: 12px 14px; font-size: 15px; outline: none;
  }
  .add-row input:focus { border-color: var(--accent); }
  .add-row button {
    border: none; background: var(--text); color: var(--bg);
    border-radius: 14px; padding: 0 18px; font-weight: 700; cursor: pointer;
  }

  .history { list-style: none; }
  .history li {
    display: flex; justify-content: space-between; padding: 10px 4px;
    border-bottom: 1px solid var(--border); font-size: 15px;
  }
  .history li span { color: var(--sub); font-size: 13px; }

  footer { text-align: center; color: var(--sub); font-size: 12px; margin-top: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>오늘 <span>뭐 먹지?</span></h1>
      <p class="sub">고민은 그만, 버튼 하나로 메뉴 결정 🍽️</p>
    </div>
    <button class="theme-btn" id="themeBtn" title="다크 모드 전환">🌙</button>
  </header>

  <div class="card" id="card">
    <div class="emoji" id="emoji">🤔</div>
    <div class="menu-name" id="menuName">뭐 먹을까?</div>
    <div class="menu-cat" id="menuCat">아래 버튼을 눌러 보세요</div>
    <button class="pick-btn" id="pickBtn">🎲 메뉴 뽑기</button>
    <div class="result-actions" id="resultActions">
      <button id="okBtn">😋 이걸로 결정!</button>
      <button id="nopeBtn">🙅 이건 싫어, 다시</button>
    </div>
  </div>

  <div class="section-title">먹고 싶은 종류 <small>여러 개 고를 수 있어요</small></div>
  <div class="chips" id="chips"></div>

  <div class="section-title">오늘은 빼기 <small>눌러서 다시 넣기</small></div>
  <div class="excluded" id="excluded"><span class="empty">아직 뺀 메뉴가 없어요</span></div>

  <div class="section-title">내 메뉴 추가하기</div>
  <div class="add-row">
    <input id="addInput" type="text" maxlength="20" placeholder="예: 엄마표 김치볶음밥">
    <button id="addBtn">추가</button>
  </div>

  <div class="section-title">최근 결정한 메뉴</div>
  <ul class="history" id="history"><li class="empty">아직 기록이 없어요</li></ul>

  <footer>선택장애를 위한 메뉴 랜덤 뽑기 · Made with HTML, CSS, JavaScript</footer>
</div>

<script>
  // ===== 메뉴 데이터 =====
  const MENUS = [
    // 한식
    { name: "김치찌개", emoji: "🍲", cat: "한식" },
    { name: "된장찌개", emoji: "🥘", cat: "한식" },
    { name: "비빔밥", emoji: "🍚", cat: "한식" },
    { name: "불고기", emoji: "🥩", cat: "한식" },
    { name: "제육볶음", emoji: "🐷", cat: "한식" },
    { name: "삼겹살", emoji: "🥓", cat: "한식" },
    { name: "순두부찌개", emoji: "🌶️", cat: "한식" },
    { name: "국밥", emoji: "🍜", cat: "한식" },
    { name: "냉면", emoji: "🧊", cat: "한식" },
    { name: "닭갈비", emoji: "🍗", cat: "한식" },
    { name: "갈비탕", emoji: "🍖", cat: "한식" },
    { name: "부대찌개", emoji: "🌭", cat: "한식" },
    { name: "칼국수", emoji: "🍜", cat: "한식" },
    { name: "보쌈", emoji: "🥬", cat: "한식" },
    // 중식
    { name: "짜장면", emoji: "🍝", cat: "중식" },
    { name: "짬뽕", emoji: "🌶️", cat: "중식" },
    { name: "탕수육", emoji: "🍖", cat: "중식" },
    { name: "마라탕", emoji: "🥵", cat: "중식" },
    { name: "볶음밥", emoji: "🍳", cat: "중식" },
    { name: "마파두부", emoji: "🫕", cat: "중식" },
    { name: "꿔바로우", emoji: "🥠", cat: "중식" },
    // 일식
    { name: "초밥", emoji: "🍣", cat: "일식" },
    { name: "돈까스", emoji: "🍛", cat: "일식" },
    { name: "라멘", emoji: "🍜", cat: "일식" },
    { name: "우동", emoji: "🍥", cat: "일식" },
    { name: "규동", emoji: "🍚", cat: "일식" },
    { name: "카레라이스", emoji: "🍛", cat: "일식" },
    { name: "회덮밥", emoji: "🐟", cat: "일식" },
    // 양식
    { name: "파스타", emoji: "🍝", cat: "양식" },
    { name: "피자", emoji: "🍕", cat: "양식" },
    { name: "햄버거", emoji: "🍔", cat: "양식" },
    { name: "스테이크", emoji: "🥩", cat: "양식" },
    { name: "리조또", emoji: "🧀", cat: "양식" },
    { name: "샌드위치", emoji: "🥪", cat: "양식" },
    { name: "샐러드", emoji: "🥗", cat: "양식" },
    // 분식
    { name: "떡볶이", emoji: "🌶️", cat: "분식" },
    { name: "김밥", emoji: "🍙", cat: "분식" },
    { name: "라면", emoji: "🍜", cat: "분식" },
    { name: "순대", emoji: "🌭", cat: "분식" },
    { name: "쫄면", emoji: "🍝", cat: "분식" },
    { name: "튀김", emoji: "🍤", cat: "분식" },
    // 아시안
    { name: "쌀국수", emoji: "🍜", cat: "아시안" },
    { name: "팟타이", emoji: "🥢", cat: "아시안" },
    { name: "분짜", emoji: "🥗", cat: "아시안" },
    { name: "인도 커리", emoji: "🍛", cat: "아시안" },
    { name: "타코", emoji: "🌮", cat: "아시안" },
    // 기타
    { name: "치킨", emoji: "🍗", cat: "기타" },
    { name: "족발", emoji: "🐖", cat: "기타" },
    { name: "편의점 도시락", emoji: "🍱", cat: "기타" },
    { name: "포케", emoji: "🥙", cat: "기타" },
  ];
  const CATEGORIES = ["한식", "중식", "일식", "양식", "분식", "아시안", "기타", "내 메뉴"];

  // ===== 저장 도우미 (브라우저에 기록 저장) =====
  function load(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  // ===== 상태 =====
  let selectedCats = new Set(CATEGORIES);
  let excluded = new Set();
  let customMenus = load("customMenus", []);
  let history = load("history", []);
  let current = null;
  let rolling = false;

  // ===== 화면 요소 =====
  const $ = (id) => document.getElementById(id);
  const card = $("card"), emojiEl = $("emoji"), nameEl = $("menuName"), catEl = $("menuCat");
  const pickBtn = $("pickBtn"), resultActions = $("resultActions");

  function allMenus() {
    return MENUS.concat(customMenus.map(n => ({ name: n, emoji: "⭐", cat: "내 메뉴" })));
  }
  function candidates() {
    return allMenus().filter(m => selectedCats.has(m.cat) && !excluded.has(m.name));
  }

  // ===== 카테고리 칩 =====
  function renderChips() {
    const box = $("chips");
    box.innerHTML = "";
    CATEGORIES.forEach(cat => {
      if (cat === "내 메뉴" && customMenus.length === 0) return;
      const b = document.createElement("button");
      b.className = "chip" + (selectedCats.has(cat) ? " on" : "");
      b.textContent = cat;
      b.onclick = () => {
        selectedCats.has(cat) ? selectedCats.delete(cat) : selectedCats.add(cat);
        renderChips();
      };
      box.appendChild(b);
    });
  }

  // ===== 제외 목록 =====
  function renderExcluded() {
    const box = $("excluded");
    box.innerHTML = "";
    if (excluded.size === 0) {
      box.innerHTML = '<span class="empty">아직 뺀 메뉴가 없어요</span>';
      return;
    }
    excluded.forEach(name => {
      const t = document.createElement("button");
      t.className = "tag";
      t.textContent = name + " ✕";
      t.onclick = () => { excluded.delete(name); renderExcluded(); };
      box.appendChild(t);
    });
  }

  // ===== 기록 =====
  function renderHistory() {
    const ul = $("history");
    ul.innerHTML = "";
    if (history.length === 0) {
      ul.innerHTML = '<li class="empty">아직 기록이 없어요</li>';
      return;
    }
    history.forEach(h => {
      const li = document.createElement("li");
      li.textContent = h.emoji + " " + h.name;
      const s = document.createElement("span");
      s.textContent = h.date;
      li.appendChild(s);
      ul.appendChild(li);
    });
  }

  // ===== 화면에 메뉴 표시 =====
  function show(menu) {
    emojiEl.textContent = menu.emoji;
    nameEl.textContent = menu.name;
    catEl.textContent = menu.cat;
  }

  // ===== 메뉴 뽑기 (슬롯머신 효과) =====
  function pick() {
    if (rolling) return;
    const list = candidates();
    if (list.length === 0) {
      emojiEl.textContent = "😵";
      nameEl.textContent = "고를 메뉴가 없어요";
      catEl.textContent = "종류를 선택하거나 뺀 메뉴를 다시 넣어 주세요";
      return;
    }
    rolling = true;
    pickBtn.disabled = true;
    resultActions.classList.remove("show");
    card.classList.add("rolling");

    // 방금 나온 메뉴는 연속으로 나오지 않게
    let pool = list.length > 1 && current ? list.filter(m => m.name !== current.name) : list;
    const final = pool[Math.floor(Math.random() * pool.length)];

    let delay = 40, elapsed = 0;
    function tick() {
      show(list[Math.floor(Math.random() * list.length)]);
      elapsed += delay;
      delay *= 1.12; // 점점 느려지게
      if (elapsed < 1600) {
        setTimeout(tick, delay);
      } else {
        current = final;
        show(final);
        card.classList.remove("rolling");
        nameEl.classList.remove("pop"); void nameEl.offsetWidth; nameEl.classList.add("pop");
        emojiEl.classList.remove("pop"); void emojiEl.offsetWidth; emojiEl.classList.add("pop");
        pickBtn.textContent = "🎲 다시 뽑기";
        pickBtn.disabled = false;
        resultActions.classList.add("show");
        rolling = false;
      }
    }
    tick();
  }

  // ===== 버튼 동작 =====
  pickBtn.onclick = pick;

  $("nopeBtn").onclick = () => {
    if (!current) return;
    excluded.add(current.name);
    renderExcluded();
    pick();
  };

  $("okBtn").onclick = () => {
    if (!current) return;
    const d = new Date();
    history.unshift({ name: current.name, emoji: current.emoji, date: (d.getMonth() + 1) + "/" + d.getDate() });
    history = history.slice(0, 5);
    save("history", history);
    renderHistory();
    catEl.textContent = "맛있게 드세요! 😋";
    resultActions.classList.remove("show");
  };

  $("addBtn").onclick = addCustom;
  $("addInput").addEventListener("keydown", e => { if (e.key === "Enter") addCustom(); });
  function addCustom() {
    const input = $("addInput");
    const name = input.value.trim();
    if (!name) return;
    if (allMenus().some(m => m.name === name)) { input.value = ""; return; }
    customMenus.push(name);
    save("customMenus", customMenus);
    selectedCats.add("내 메뉴");
    input.value = "";
    renderChips();
  }

  // ===== 다크 모드 =====
  const themeBtn = $("themeBtn");
  function applyTheme(dark) {
    document.body.classList.toggle("dark", dark);
    themeBtn.textContent = dark ? "☀️" : "🌙";
  }
  applyTheme(load("dark", false));
  themeBtn.onclick = () => {
    const dark = !document.body.classList.contains("dark");
    applyTheme(dark);
    save("dark", dark);
  };

  // ===== 시작 =====
  renderChips();
  renderExcluded();
  renderHistory();
</script>
</body>
</html>
